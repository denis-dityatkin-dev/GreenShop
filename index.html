<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="fonts/font.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>Green Shop</title>
  </head>
  <body>
    <div class="wrapper">
      <header id="navbar" class="header">
        <div class="header__container">
          <a data-goto=".wrapper" href="#" class="header__logo">
            <img src="./images/logo.svg" alt="logo" />
          </a>
          <div class="header__menu menu menu-header">
            <nav id="menu" class="menu-header__body menu__body">
              <ul class="menu-header__list menu__list">
                <li class="menu-header__item menu__item">
                  <a data-goto=".wrapper" href="#" class="menu__link">Home</a>
                </li>
                <li class="menu-header__item menu__item">
                  <a data-goto=".Shop" href="#" class="menu__link">Shop</a>
                </li>
                <li class="menu-header__item menu__item">
                  <a data-goto=".care" href="#" class="menu__link"
                    >Plant Care</a
                  >
                </li>
                <li class="menu-header__item menu__item">
                  <a data-goto=".blogs" href="#" class="menu__link">Blogs</a>
                </li>
              </ul>
              <div class="header__actions-hide">
                <div class="actions-header__cart icon-busket"></div>
                <div class="actions-header__login icon-logout">Login</div>
              </div>
            </nav>
          </div>
          <div class="header__actions actions-header">
            <div class="actions-header__search icon-search"></div>
            <div class="actions-header__cart-hide icon-busket"></div>
            <div class="actions-header__login-hide icon-logout">Login</div>
          </div>
          <div class="header__button">
            <button type="button" class="menu__icon icon-menu">
              <span></span>
            </button>
          </div>
        </div>
      </header>
      <main class="main">
        <div class="main__container"></div>
      </main>
      <footer class="footer">
        <div class="footer__container"></div>
      </footer>
    </div>
    <script src="js/components/burger.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
	<script src="js/components/slider_swiper.js"></script> -->
    <!-- <script src="js/components/anim.js"></script> -->
  </body>
</html>
